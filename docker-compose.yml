version: "3.8"

services:
  app:
    build: .
    container_name: p2p-signal-server
    environment:
      - PORT=3000
      - NODE_ENV=production
      - API_KEY=changeme_key
      - ALLOWED_ORIGINS=*
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"